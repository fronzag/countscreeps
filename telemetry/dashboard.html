<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Colony OS — Telemetria</title>
  <style>
    :root{color-scheme:dark;--bg:#09110f;--panel:#111d19;--line:#263b34;--text:#e4f2eb;--muted:#8ca69a;--green:#6ee7a8;--yellow:#f5ce6a;--red:#ff7878;--blue:#72b7ff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#14271f,var(--bg) 55%);color:var(--text);font:14px system-ui,sans-serif}
    main{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}h1{margin:0;font-size:26px}#state{color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,.chart{background:rgba(17,29,25,.94);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 10px 30px #0003}
    .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:25px;font-weight:700;margin-top:6px}.sub{color:var(--muted);margin-top:4px}
    .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.chart h2{font-size:14px;margin:0 0 12px;color:var(--muted)}canvas{width:100%;height:220px;display:block}
    .alert{color:var(--yellow)}.danger{color:var(--red)}.ok{color:var(--green)}.badges{display:flex;gap:8px;margin-top:8px}.badge{border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;background:#0b1512}@media(max-width:760px){.charts{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}
  </style>
</head>
<body><main>
  <header><div><h1>Colony OS</h1><div id="room">Aguardando dados…</div><div class="badges"><span class="badge" id="schema">schema —</span><span class="badge" id="mode">estado —</span></div></div><div id="state">Conectando…</div></header>
  <section class="cards">
    <div class="card"><div class="label">Energia</div><div class="value" id="energy">—</div><div class="sub" id="energyPct">—</div></div>
    <div class="card"><div class="label">Controller</div><div class="value" id="rcl">—</div><div class="sub" id="progress">—</div></div>
    <div class="card"><div class="label">Creeps</div><div class="value" id="creeps">—</div><div class="sub" id="roles">—</div></div>
    <div class="card"><div class="label">CPU / Bucket</div><div class="value" id="cpu">—</div><div class="sub" id="bucket">—</div></div>
    <div class="card"><div class="label">Progresso</div><div class="value" id="rate">—</div><div class="sub">pontos por 1.000 ticks</div></div>
    <div class="card"><div class="label">Estado</div><div class="value" id="health">—</div><div class="sub" id="details">—</div></div>
    <div class="card"><div class="label">Infraestrutura</div><div class="value" id="infra">—</div><div class="sub" id="infraDetails">—</div></div>
  </section>
  <section class="charts">
    <div class="chart"><h2>Energia disponível / capacidade</h2><canvas id="energyChart"></canvas></div>
    <div class="chart"><h2>Progresso do controller</h2><canvas id="progressChart"></canvas></div>
    <div class="chart"><h2>CPU usada / bucket</h2><canvas id="cpuChart"></canvas></div>
    <div class="chart"><h2>População por papel</h2><canvas id="creepChart"></canvas></div>
    <div class="chart"><h2>Economia acumulada</h2><canvas id="economyChart"></canvas></div>
  </section>
</main><script>
const $=id=>document.getElementById(id), fmt=n=>Number(n??0).toLocaleString('pt-BR'), pct=(a,b)=>b?`${(100*a/b).toFixed(1)}%`:'—';
async function refresh(){try{const r=await fetch('/api/history',{cache:'no-store'});if(!r.ok)throw Error(await r.text());const h=await r.json();if(!h.length)throw Error('Aguardando primeira coleta');render(h);$('state').textContent=`Atualizado ${new Date().toLocaleTimeString('pt-BR')}`;$('state').className='ok'}catch(e){$('state').textContent=e.message;$('state').className='danger'}}
function render(h){const x=h.at(-1),r=x.room,c=r.creeps,t=r.targets,total=Object.values(c).reduce((a,b)=>a+b,0),infra=r.infrastructure||{},siteTypes=infra.sitesByType||{};$('room').textContent=`${r.name} · tick ${fmt(x.tick)} · ${x.shard||'servidor privado'}`;$('schema').textContent=`schema ${x.schema||1}`;$('schema').className=`badge ${(x.schema||1)>=2?'ok':'danger'}`;$('mode').textContent=`estado ${x.state||'LEGACY'}`;$('mode').className=`badge ${x.state==='DEFEND'||x.state==='RECOVERY'?'danger':x.state==='STABILIZE'?'alert':'ok'}`;$('energy').textContent=`${fmt(r.energyAvailable)} / ${fmt(r.energyCapacity)}`;$('energyPct').textContent=`${pct(r.energyAvailable,r.energyCapacity)} da capacidade`;$('rcl').textContent=`RCL ${r.rcl}`;$('progress').textContent=`${fmt(r.progress)} / ${fmt(r.progressTotal)} (${pct(r.progress,r.progressTotal)})`;$('creeps').textContent=total;$('roles').textContent=`M ${c.miner||0}/${t.miner||0} · T ${c.hauler||0}/${t.hauler||0} · H ${c.harvester||0}/${t.harvester||0} · U ${c.upgrader||0}/${t.upgrader||0} · B ${c.builder||0}/${t.builder||0}`;$('cpu').textContent=`${x.cpu.used} / ${x.cpu.limit}`;$('bucket').textContent=`bucket ${fmt(x.cpu.bucket)}`;$('infra').textContent=`Ext ${infra.extensionsBuilt??'—'}/${infra.extensionsAllowed??'—'}`;$('infraDetails').textContent=`fontes ${infra.sourceContainers??'—'}/2 · controller ${infra.controllerContainer?'OK':'pendente'} · estradas ${siteTypes.road||0}`;
const same=h.filter(v=>v.room.rcl===r.rcl);let rate=0;if(same.length>1){const a=same[0],dt=x.tick-a.tick;if(dt>0)rate=(r.progress-a.room.progress)*1000/dt}$('rate').textContent=rate>0?fmt(Math.round(rate)):'—';const issues=[];if(x.cpu.bucket<3000)issues.push('bucket baixo');if(r.hostiles)issues.push(`${r.hostiles} hostis`);for(const k of Object.keys(c))if(c[k]<(t[k]||0))issues.push(`${k} abaixo da meta`);if(r.energyCapacity&&r.energyAvailable/r.energyCapacity<.15)issues.push('energia baixa');if((r.droppedEnergy||0)>500)issues.push(`${fmt(r.droppedEnergy)} energia no chão`);$('health').textContent=issues.length?'ATENÇÃO':(x.state||'SAUDÁVEL');$('health').className=`value ${issues.length?'alert':'ok'}`;$('details').textContent=issues.join(' · ')||`${r.constructionSites} obras · ${r.containers?.length||0} containers · spawn ${x.spawn.spawning||'livre'}`;
draw('energyChart',h,[['disponível',v=>v.room.energyAvailable,'#6ee7a8'],['capacidade',v=>v.room.energyCapacity,'#f5ce6a']]);draw('progressChart',same,[['progresso',v=>v.room.progress,'#72b7ff']]);draw('cpuChart',h,[['CPU',v=>v.cpu.used,'#ff7878'],['bucket / 1000',v=>v.cpu.bucket/1000,'#f5ce6a']]);draw('creepChart',h,[['miner',v=>v.room.creeps.miner||0,'#6ee7a8'],['hauler',v=>v.room.creeps.hauler||0,'#b58cff'],['upgrader',v=>v.room.creeps.upgrader||0,'#72b7ff'],['builder',v=>v.room.creeps.builder||0,'#f5ce6a']]);const econ=h.filter(v=>v.economy);if(econ.length)draw('economyChart',econ,[['extraída',v=>v.economy.harvested||0,'#6ee7a8'],['entregue',v=>v.economy.delivered||0,'#72b7ff'],['controller',v=>v.economy.upgraded||0,'#b58cff'],['obras',v=>v.economy.built||0,'#f5ce6a']])}
function draw(id,data,series){const c=$(id),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);g.clearRect(0,0,w,h);const p={l:42,r:12,t:16,b:25},vals=series.flatMap(s=>data.map(s[1])).filter(Number.isFinite),max=Math.max(1,...vals),min=Math.min(0,...vals);g.strokeStyle='#263b34';g.fillStyle='#8ca69a';g.font='11px system-ui';for(let i=0;i<=4;i++){const y=p.t+(h-p.t-p.b)*i/4;g.beginPath();g.moveTo(p.l,y);g.lineTo(w-p.r,y);g.stroke();g.fillText(Math.round(max-(max-min)*i/4),2,y+4)}series.forEach(([name,get,color],si)=>{g.strokeStyle=color;g.lineWidth=2;g.beginPath();data.forEach((v,i)=>{const x=p.l+(w-p.l-p.r)*(data.length===1?1:i/(data.length-1)),y=p.t+(h-p.t-p.b)*(1-(get(v)-min)/(max-min||1));i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle=color;g.fillText(name,p.l+si*90,h-6)})}
refresh();setInterval(refresh,15000);addEventListener('resize',refresh);
</script></body></html>
